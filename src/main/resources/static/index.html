<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>API de Usuários</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><h1>Cadastro de Usuários</h1></header>
<main>
<form id="usuarioForm">
<input type="hidden" id="usuarioId">
<label>Nome</label><input type="text" id="nome" required>
<label>E-mail</label><input type="email" id="email" required>
<label>Senha</label><input type="password" id="senha" required>
<div><button type="submit">Salvar</button><button type="button" onclick="limparFormulario()">Limpar</button></div>
</form>
<h2>Usuários cadastrados</h2>
<table><thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Ações</th></tr></thead><tbody id="usuariosTabela"></tbody></table>
</main>
<script src="/app.js"></script>
</body>
</html>
